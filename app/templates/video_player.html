<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Acadza - Video Player</title>
    <style>
    :root { --bg:#0f172a; --card:#1e293b; --accent:#3b82f6; --text:#f1f5f9; --muted:#94a3b8; --border:#475569; --error:#ef4444; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:20px; }
    .wrap { max-width:640px; width:100%; }
    .logo { text-align:center; margin-bottom:20px; }
    .logo h1 { font-size:20px; font-weight:800; background:linear-gradient(135deg,var(--accent),#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:14px; }
    .card-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); padding:16px 16px 10px; }
    .vid-wrap { position:relative; width:100%; background:#000; min-height:200px; }
    .vid-wrap iframe { width:100%; height:360px; border:none; display:block; }
    .vid-wrap video { width:100%; display:block; max-height:70vh; }
    .loading { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(15,23,42,0.85); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:opacity .4s; z-index:10; }
    .loading.done { opacity:0; pointer-events:none; }
    .spinner { width:36px; height:36px; border:3px solid rgba(255,255,255,0.15); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-text { font-size:11px; color:rgba(255,255,255,0.7); margin-top:8px; text-align:center; line-height:1.4; }
    .info { padding:12px 16px; }
    .status { font-size:11px; color:var(--muted); text-align:center; }
    .err { text-align:center; color:var(--error); font-size:14px; padding:20px; }
    .hidden { display:none !important; }
    .drive-link { display:block; text-align:center; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; opacity:0.6; transition:opacity .2s; }
    .drive-link:hover { opacity:1; }
    .fallback-hint { text-align:center; margin-top:8px; }
    .fallback-btn { display:inline-block; padding:6px 16px; font-size:11px; font-weight:600; color:var(--accent); background:rgba(59,130,246,0.08); border:1px solid rgba(59,130,246,0.25); border-radius:6px; cursor:pointer; transition:all .2s; text-decoration:none; }
    .fallback-btn:hover { background:rgba(59,130,246,0.18); border-color:var(--accent); }
    </style>
</head>
<body>
<div class="wrap">
    <div class="logo"><h1>Acadza Video</h1></div>

    <div class="card" id="p-card">
        <div class="card-title">Video Player</div>
        <div class="vid-wrap" id="vid-wrap">
            <iframe id="drive-iframe" class="hidden" allowfullscreen allow="autoplay"></iframe>
            <video id="proxy-player" class="hidden" controls playsinline preload="auto"></video>
            <div class="loading" id="loader">
                <div class="spinner"></div>
                <div class="loading-text" id="load-text">Loading video...</div>
            </div>
        </div>
        <div class="info">
            <div class="status" id="ps">Loading...</div>
            <div class="fallback-hint hidden" id="fallback-hint">
                <span class="fallback-btn" onclick="manualFallback()">Video not loading? Click here</span>
            </div>
            <a id="drive-link" class="drive-link hidden" target="_blank" rel="noopener">Open on Google Drive</a>
        </div>
    </div>

    <div class="card hidden" id="e-card"><div class="err" id="em">Video not found.</div></div>
</div>

<script>
(()=>{
    const PROXY_LOADER_TIMEOUT = 15000;
    const FALLBACK_BTN_DELAY = 5000;

    const iframe   = document.getElementById('drive-iframe');
    const video    = document.getElementById('proxy-player');
    const loader   = document.getElementById('loader');
    const loadText = document.getElementById('load-text');
    const ps       = document.getElementById('ps');
    const fallbackHint = document.getElementById('fallback-hint');

    const params = new URLSearchParams(location.search);
    const v = params.get('v');
    let startTs = Date.now();

    if (!v) {
        document.getElementById('p-card').classList.add('hidden');
        document.getElementById('e-card').classList.remove('hidden');
        return;
    }

    // Drive link
    var driveLink = document.getElementById('drive-link');
    driveLink.href = 'https://drive.google.com/file/d/' + v + '/view';
    driveLink.classList.remove('hidden');

    // fresh=1 means just-uploaded — skip check, go straight to proxy
    if (params.get('fresh') === '1') {
        playViaProxy('fresh_upload');
        return;
    }

    // ──────────────────────────────────────────
    // Step 1: Ask server if Drive has processed the video
    // ──────────────────────────────────────────
    loadText.textContent = 'Checking video status...';

    fetch('/video/api/check/' + v)
        .then(r => r.json())
        .then(d => {
            if (d.ready) {
                // Drive has processed it — use iframe (saves server bandwidth)
                playViaIframe();
            } else {
                // Still processing — go straight to proxy (reliable)
                playViaProxy('not_processed');
            }
        })
        .catch(() => {
            // Check failed (server down?) — try proxy
            playViaProxy('check_failed');
        });

    // ──────────────────────────────────────────
    // Iframe path (only when Drive has processed)
    // ──────────────────────────────────────────
    function playViaIframe() {
        iframe.src = 'https://drive.google.com/file/d/' + v + '/preview';
        iframe.classList.remove('hidden');

        iframe.addEventListener('load', () => {
            loader.classList.add('done');
            ps.textContent = 'Powered by Acadza Video';
            sendLog('iframe', Date.now() - startTs);
        });

        // Show manual fallback button after 5s (safety net)
        setTimeout(() => {
            fallbackHint.classList.remove('hidden');
        }, FALLBACK_BTN_DELAY);
    }

    // ──────────────────────────────────────────
    // Proxy path (when Drive hasn't processed or manual fallback)
    // ──────────────────────────────────────────
    function playViaProxy(reason) {
        iframe.classList.add('hidden');
        video.classList.remove('hidden');
        fallbackHint.classList.add('hidden');
        loadText.textContent = 'Loading video...';
        loader.classList.remove('done');

        video.src = '/video/api/proxy/' + v;

        video.addEventListener('canplay', () => {
            loader.classList.add('done');
            ps.textContent = 'Powered by Acadza Video';
            sendLog('proxy', Date.now() - startTs);
        }, { once: true });

        video.addEventListener('error', () => {
            document.getElementById('p-card').classList.add('hidden');
            document.getElementById('e-card').classList.remove('hidden');
            document.getElementById('em').textContent = 'Video not found or expired.';
            sendLog('error', Date.now() - startTs);
        }, { once: true });

        setTimeout(() => loader.classList.add('done'), PROXY_LOADER_TIMEOUT);
    }

    // Manual fallback (user clicks button while iframe is showing)
    window.manualFallback = function() {
        playViaProxy('manual');
    };

    // Fire-and-forget server log
    function sendLog(method, elapsedMs) {
        try {
            fetch('/video/api/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    file_id: v,
                    method: method,
                    elapsed_ms: elapsedMs,
                    user_agent: navigator.userAgent,
                }),
            }).catch(() => {});
        } catch(e) {}
    }
})();
</script>
</body>
</html>
