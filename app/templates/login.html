<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Acadza</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
            background: #080910;
            color: #e4e6ef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background gear — emerging from right, ~30% cropped, clearly a gear */
        .bg-gear {
            position: fixed;
            right: -20%;
            top: 50%;
            transform: translateY(-50%);
            width: 110vh;
            height: 110vh;
            opacity: 0.09;
            pointer-events: none;
            z-index: 0;
        }

        /* Hide reCAPTCHA badge completely */
        .grecaptcha-badge {
            visibility: hidden !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            overflow: hidden !important;
            position: fixed !important;
            left: -9999px !important;
        }

        .login-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }

        .logo {
            display: block;
            margin: 0 auto 36px;
            height: 38px;
        }

        /* Glass card — gear silhouette bleeds through with frosted blur */
        .card {
            background: rgba(20, 24, 42, 0.4);
            backdrop-filter: blur(14px) saturate(1.4);
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            border: 1px solid rgba(79, 125, 249, 0.12);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 0 80px rgba(79, 125, 249, 0.04);
        }

        .card h2 {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .card .sub {
            font-size: 13px;
            color: #5c6280;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #7a80a0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .field { margin-bottom: 22px; }

        .phone-row {
            display: flex;
            gap: 8px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(26, 29, 42, 0.8);
            border: 1px solid rgba(45, 49, 72, 0.6);
            border-radius: 8px;
            color: #e4e6ef;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: rgba(79, 125, 249, 0.5);
            box-shadow: 0 0 0 3px rgba(79, 125, 249, 0.1);
        }
        input::placeholder { color: #3d4268; }

        .cc {
            width: 64px;
            flex-shrink: 0;
            text-align: center;
            color: #7a80a0;
            background: rgba(20, 22, 34, 0.9);
        }

        /* OTP boxes */
        .otp-boxes {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .otp-box {
            width: 46px;
            height: 52px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            padding: 0;
            border-radius: 10px;
            background: rgba(26, 29, 42, 0.8);
            border: 1.5px solid rgba(45, 49, 72, 0.6);
            color: #e4e6ef;
            caret-color: #4f7df9;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-text-security: disc;
        }
        .otp-box:focus {
            border-color: #4f7df9;
            box-shadow: 0 0 0 3px rgba(79, 125, 249, 0.15);
        }
        .otp-box.filled {
            border-color: rgba(79, 125, 249, 0.4);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #4f7df9;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .btn:hover { background: #3d6be6; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,125,249,0.3); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Loading spinner inside button */
        .btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }
        .btn.loading .spinner { display: inline-block; }
        .btn.loading .btn-text { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .msg.err { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); color: #f87171; }
        .msg.ok  { background: rgba(79,125,249,0.08); border: 1px solid rgba(79,125,249,0.2); color: #8badff; }
        .msg.vis { display: block; }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .link-row {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #5c6280;
        }
        .link-row a { color: #4f7df9; cursor: pointer; text-decoration: none; transition: color 0.15s; }
        .link-row a:hover { color: #8badff; }

        #recaptcha-container { display: flex; justify-content: center; margin-bottom: 12px; }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            background: rgba(18, 20, 32, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(79, 125, 249, 0.2);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            z-index: 100;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 340px;
        }
        .toast.show { transform: translateX(0); }
        .toast h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #e4e6ef; }
        .toast p { font-size: 13px; color: #9096b0; line-height: 1.4; }
        .toast .toast-accent { color: #4f7df9; font-weight: 500; }

        /* Footer branding */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: #2d3148;
            letter-spacing: 0.5px;
        }

        /* Subtle ambient glow */
        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(79,125,249,0.06) 0%, transparent 70%);
            top: 30%;
            left: 20%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>
    <!-- Background gear logo -->
    <img src="/static/img/acadza-gear-white.svg" alt="" class="bg-gear">

    <!-- Toast notification -->
    <div id="toast" class="toast">
        <h3 id="toast-title"></h3>
        <p id="toast-sub"></p>
    </div>

    <div class="login-wrap">
        <img src="/static/img/acadza-logo-white.svg" alt="Acadza" class="logo">

        <div class="card">
            <h2>Welcome back</h2>
            <p class="sub">Sign in with your phone number</p>

            <div id="msg-err" class="msg err"></div>
            <div id="msg-ok" class="msg ok"></div>

            <!-- Step 1: Phone -->
            <div id="step-phone" class="step active">
                <div class="field">
                    <label>Phone number</label>
                    <div class="phone-row">
                        <input type="text" class="cc" value="+91" readonly>
                        <input type="tel" id="phone" placeholder="10-digit number"
                               maxlength="10" autofocus>
                    </div>
                </div>
                <div id="recaptcha-container"></div>
                <button id="btn-send" class="btn" onclick="sendOTP()" disabled>
                    <span class="btn-text">Send OTP</span>
                    <span class="spinner"></span>
                </button>
            </div>

            <!-- Step 2: OTP -->
            <div id="step-otp" class="step">
                <div class="field">
                    <label>Verification code</label>
                    <div class="otp-boxes">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" data-idx="0">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" data-idx="1">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" data-idx="2">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" data-idx="3">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" data-idx="4">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" data-idx="5">
                    </div>
                </div>
                <button id="btn-verify" class="btn" onclick="verifyOTP()">
                    <span class="btn-text">Verify</span>
                    <span class="spinner"></span>
                </button>
                <div class="link-row">
                    <a onclick="goBack()">Change number</a>
                </div>
            </div>
        </div>

        <div class="login-footer">ACADZA AUTOMATION SUITE</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

    <script>
    const firebaseConfig = {
        apiKey: "{{ firebase_api_key }}",
        authDomain: "{{ firebase_auth_domain }}",
        projectId: "{{ firebase_project_id }}",
        storageBucket: "{{ firebase_storage_bucket }}",
        messagingSenderId: "{{ firebase_messaging_sender_id }}",
        appId: "{{ firebase_app_id }}"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    let confirmResult = null;
    let recaptcha = null;
    let recaptchaWidgetId = null;

    function log(msg) { console.log('[AUTH]', msg); }

    function showErr(m) { log('ERROR: ' + m); const e = document.getElementById('msg-err'); e.textContent = m; e.classList.add('vis'); document.getElementById('msg-ok').classList.remove('vis'); }
    function showOk(m)  { log('OK: ' + m); const e = document.getElementById('msg-ok');  e.textContent = m; e.classList.add('vis'); document.getElementById('msg-err').classList.remove('vis'); }
    function clearMsg()  { document.getElementById('msg-err').classList.remove('vis'); document.getElementById('msg-ok').classList.remove('vis'); }

    // Motivational lines — vary by time of day
    const MOTIVATIONS = {
        morning: [
            "Fresh day, fresh uploads.",
            "Build something great today.",
            "The early grind pays off.",
            "Let's make today count.",
        ],
        afternoon: [
            "Momentum is everything.",
            "Keep the pipeline flowing.",
            "Halfway there, stay sharp.",
            "Great work takes persistence.",
        ],
        evening: [
            "One more push, champion.",
            "Consistency builds empires.",
            "Strong finish to the day.",
            "Quality over quantity, always.",
        ],
    };

    function getMotivation() {
        const h = new Date().getHours();
        const bucket = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
        const lines = MOTIVATIONS[bucket];
        return lines[Math.floor(Math.random() * lines.length)];
    }

    function showToast(title, sub) {
        const t = document.getElementById('toast');
        document.getElementById('toast-title').textContent = title;
        document.getElementById('toast-sub').textContent = sub;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 6000);
    }

    function setLoading(btn, loading) {
        if (loading) { btn.classList.add('loading'); btn.disabled = true; }
        else { btn.classList.remove('loading'); btn.disabled = false; }
    }

    // ── reCAPTCHA ──
    function initRecaptcha() {
        log('Initializing reCAPTCHA...');
        if (recaptcha) {
            try { recaptcha.clear(); } catch(e) { log('clear() ok: ' + e.message); }
            recaptcha = null;
        }
        const old = document.getElementById('recaptcha-container');
        const el = document.createElement('div');
        el.id = 'recaptcha-container';
        old.parentNode.replaceChild(el, old);
        document.querySelectorAll('iframe[src*="recaptcha"]').forEach(f => { if (!el.contains(f)) f.remove(); });

        recaptcha = new firebase.auth.RecaptchaVerifier(el, {
            size: 'invisible',
            callback: (token) => { log('reCAPTCHA solved, len=' + token.length); },
            'expired-callback': () => { log('reCAPTCHA expired'); }
        });
        recaptcha.render().then((wid) => {
            recaptchaWidgetId = wid;
            log('reCAPTCHA ready, widget=' + wid);
            document.getElementById('btn-send').disabled = false;
        }).catch((err) => {
            log('reCAPTCHA error: ' + err.message);
            showErr('reCAPTCHA failed to load. Refresh the page.');
        });
    }

    // ── Phone input ──
    document.getElementById('phone').addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '').slice(0, 10);
    });
    document.getElementById('phone').addEventListener('keydown', e => { if (e.key === 'Enter') sendOTP(); });

    // ── OTP boxes ──
    const otpBoxes = document.querySelectorAll('.otp-box');
    otpBoxes.forEach((box, i) => {
        box.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 1);
            if (this.value) {
                this.classList.add('filled');
                if (i < 5) otpBoxes[i + 1].focus();
                // Auto-verify when all 6 digits entered
                if (i === 5) {
                    const otp = getOTP();
                    if (otp.length === 6) setTimeout(() => verifyOTP(), 150);
                }
            } else {
                this.classList.remove('filled');
            }
        });
        box.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && i > 0) {
                otpBoxes[i - 1].focus();
                otpBoxes[i - 1].value = '';
                otpBoxes[i - 1].classList.remove('filled');
            }
        });
        // Handle paste of full OTP
        box.addEventListener('paste', function(e) {
            e.preventDefault();
            const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
            if (pasted.length >= 1) {
                for (let j = 0; j < 6; j++) {
                    otpBoxes[j].value = pasted[j] || '';
                    if (pasted[j]) otpBoxes[j].classList.add('filled');
                }
                otpBoxes[Math.min(pasted.length, 5)].focus();
                if (pasted.length === 6) setTimeout(() => verifyOTP(), 150);
            }
        });
    });

    function getOTP() {
        return Array.from(otpBoxes).map(b => b.value).join('');
    }

    function clearOTP() {
        otpBoxes.forEach(b => { b.value = ''; b.classList.remove('filled'); });
    }

    // ── Send OTP ──
    async function sendOTP() {
        clearMsg();
        const phone = document.getElementById('phone').value.trim();
        if (!/^\d{10}$/.test(phone)) { showErr('Enter a valid 10-digit number'); return; }

        const btn = document.getElementById('btn-send');
        setLoading(btn, true);
        const fullPhone = '+91' + phone;
        log('Sending OTP to ' + fullPhone);

        try {
            confirmResult = await auth.signInWithPhoneNumber(fullPhone, recaptcha);
            log('OTP sent successfully');
            showOk('OTP sent to ' + fullPhone);
            document.getElementById('step-phone').classList.remove('active');
            document.getElementById('step-otp').classList.add('active');
            otpBoxes[0].focus();
        } catch (err) {
            log('Send FAILED: ' + err.code + ' - ' + err.message);
            if (err.code === 'auth/too-many-requests') showErr('Too many attempts. Try again later.');
            else if (err.code === 'auth/invalid-phone-number') showErr('Invalid phone number.');
            else if (err.code === 'auth/quota-exceeded') showErr('SMS quota exceeded.');
            else showErr(err.message || 'Failed to send OTP');
            setLoading(btn, false);
            initRecaptcha();
        }
    }

    // ── Verify OTP ──
    async function verifyOTP() {
        clearMsg();
        const otp = getOTP();
        if (otp.length !== 6) { showErr('Enter all 6 digits'); return; }

        const btn = document.getElementById('btn-verify');
        setLoading(btn, true);
        log('Verifying OTP...');

        try {
            const result = await confirmResult.confirm(otp);
            const idToken = await result.user.getIdToken();
            log('Firebase verified, posting to server...');

            const resp = await fetch('/auth/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id_token: idToken }),
            });
            const data = await resp.json();
            log('Server: ' + JSON.stringify(data));

            if (data.success) {
                // Show personalized greeting toast
                const hour = new Date().getHours();
                const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
                const name = data.user_name || 'there';
                const firstName = name.split(' ')[0];
                const motivation = getMotivation();
                showToast(greeting + ', ' + firstName + '!', motivation);

                // Redirect after user can read the toast
                setTimeout(() => { window.location.href = data.redirect || '/'; }, 2500);
            } else {
                showErr(data.error || 'Verification failed');
                setLoading(btn, false);
            }
        } catch (err) {
            log('Verify FAILED: ' + (err.code || '') + ' - ' + err.message);
            if (err.code === 'auth/invalid-verification-code') showErr('Invalid OTP. Try again.');
            else if (err.code === 'auth/code-expired') showErr('OTP expired. Request a new one.');
            else showErr(err.message || 'Verification failed');
            setLoading(btn, false);
            clearOTP();
            otpBoxes[0].focus();
        }
    }

    // ── Go back ──
    function goBack() {
        log('Back to phone');
        clearMsg();
        confirmResult = null;
        clearOTP();
        document.getElementById('step-otp').classList.remove('active');
        document.getElementById('step-phone').classList.add('active');
        document.getElementById('phone').focus();
        initRecaptcha();
    }

    document.addEventListener('DOMContentLoaded', () => {
        log('Page loaded, project: ' + firebaseConfig.projectId);
        initRecaptcha();
    });
    </script>
</body>
</html>
